services:
  # ----------------------------------------------------------------
  # 1. Spring Boot Enterprise Backend Service (Render Web Service)
  # ----------------------------------------------------------------
  - type: web
    name: helpdesk-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/tickets
    envVars:
      - key: PORT
        value: 8080
      - key: ADMIN_NAME
        value: System Administrator
      - key: ADMIN_EMAIL
        value: admin@helpdesk.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_DEPT
        value: IT Operations

  # ----------------------------------------------------------------
  # 2. Apple Dark Glass Frontend (Render Static Site)
  # ----------------------------------------------------------------
  - type: web
    name: helpdesk-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: ""
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
