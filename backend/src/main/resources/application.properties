# ==========================================================
# AI IT Support & Helpdesk System - Application Configuration
# ==========================================================

server.port=${SERVER_PORT:8080}

# ----------------------------------------------------------
# Mode 1: In-Memory H2 Database (Default - Zero Setup Needed)
# ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# Initial Administrator Account Credentials (Configurable)
# ----------------------------------------------------------
app.security.admin.name=${ADMIN_NAME:System Administrator}
app.security.admin.email=${ADMIN_EMAIL:admin@helpdesk.com}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.admin.department=${ADMIN_DEPT:IT Operations}

# ----------------------------------------------------------
# JPA & Hibernate Settings
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Logging
logging.level.com.helpdesk=INFO
