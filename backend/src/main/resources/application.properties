# ==========================================================
# AI IT Support & Helpdesk System - Application Configuration
# ==========================================================

server.port=8080

# ----------------------------------------------------------
# Mode 1: In-Memory H2 Database (Default - Zero Setup Needed)
# ----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# Mode 2: Local MySQL Database (Uncomment to use MySQL)
# ----------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/it_helpdesk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Logging
logging.level.com.helpdesk=INFO
